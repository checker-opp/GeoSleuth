[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geolocator-osint"
version = "0.1.0"
description = "Image -> location OSINT tool (EXIF + reverse geocoding + OCR, with a roadmap to ML geo-estimation)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
    "exifread>=3.0.0",
    "requests>=2.31.0",
    "pytesseract>=0.3.10",
    "langdetect>=1.0.9",
    "pysolar>=0.11",
]

# Install profiles:
#   pip install .            -> API-only (GeoSeer + OCR + geocoding; no downloads)
#   pip install .[clip]      -> local GeoCLIP / StreetCLIP models (torch, ~3 GB weights)
#   pip install .[web]       -> the browser UI
#   pip install .[all]       -> everything
[project.optional-dependencies]
clip = ["torch>=2.0.0", "geoclip>=1.2.0", "transformers>=4.40,<5"]
web = ["flask>=3.0.0"]
all = [
    "torch>=2.0.0", "geoclip>=1.2.0", "transformers>=4.40,<5",
    "flask>=3.0.0",
]

[project.scripts]
geolocate = "geolocator.cli:main"
geolocate-ui = "geolocator.webui:main"

[tool.setuptools]
packages = ["geolocator"]
